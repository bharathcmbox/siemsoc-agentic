<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agentic SOC Simulator</title>
  <meta name="description" content="Watch today's security team and an AI-assisted team handle the same attack, side by side. Vendor-neutral and illustrative.">
  <script>
    // Apply the saved theme before first paint. Dark is the default.
    try { document.documentElement.dataset.theme = localStorage.getItem('soc-sim.theme') || 'dark'; } catch { /* storage unavailable */ }
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 4 7v8c0 7.5 5.1 13.4 12 15 6.9-1.6 12-7.5 12-15V7z' fill='%235a72a6'/%3E%3C/svg%3E">
  <link rel="preload" href="vendor/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/exec.css">
  <link rel="stylesheet" href="css/analyst.css">
</head>
<body>
  <div class="wrap">
    <header class="appbar">
      <button class="brand" id="brand" type="button" aria-label="Agentic SOC Simulator: all stories"></button>
      <div class="bar-actions">
        <button class="pill-btn" id="theme" type="button"></button>
        <button class="pill-btn view-switch" id="view-switch" type="button" aria-pressed="false" hidden><span class="knob" aria-hidden="true"></span>Analyst view</button>
      </div>
    </header>

    <main>
      <div id="home"></div>
      <div id="exec" hidden></div>

      <div id="analyst" hidden>
        <p class="analyst-intro">Analyst view: every step, the architecture behind each side, and the assumptions behind every number. Change anything here and the executive view follows.</p>
        <div class="sticky">
          <div class="controls card" role="region" aria-label="Simulation controls">
            <label class="field">Scenario <select id="scenario"></select></label>
            <label class="field" id="variant-field">Variant <select id="variant"></select></label>
            <label class="field">Compare <select id="preset"></select></label>
            <div class="playback">
              <button class="btn primary" id="play" type="button">▶ Play</button>
              <select id="speed" aria-label="Playback speed">
                <option value="8">Slow</option>
                <option value="24" selected>Normal</option>
                <option value="80">Fast</option>
              </select>
              <input class="scrub" id="scrub" type="range" aria-label="Simulation time">
              <span class="clock" id="clock" aria-live="off">--:--</span>
              <button class="btn" id="end" type="button">Skip to end</button>
            </div>
          </div>
          <section class="narrator card" id="narrator" aria-live="polite" aria-label="Narrator"></section>
        </div>

        <section class="intro card" id="intro" aria-live="polite"></section>

        <div class="sides">
          <section class="side card" id="side-a" aria-label="Side A"></section>
          <section class="side card" id="side-b" aria-label="Side B"></section>
        </div>

        <section class="block card" id="summary" aria-live="polite"></section>
        <section class="block card" id="params"></section>
      </div>
    </main>

    <footer class="site-foot">
      A vendor-neutral study project. Read the <a href="https://github.com/bharathcmbox/siemsoc-agentic/blob/main/docs/primer.md">primer</a>,
      the <a href="https://github.com/bharathcmbox/siemsoc-agentic/blob/main/docs/assumptions.md">assumptions</a>,
      and the <a href="https://github.com/bharathcmbox/siemsoc-agentic">source</a>.
    </footer>
  </div>
  <noscript><p class="wrap">This simulator needs JavaScript.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
